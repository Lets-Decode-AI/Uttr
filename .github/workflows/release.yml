name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libxtst-dev libxi-dev cmake clang

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tauri::generate_context! needs the built frontend (frontendDist) at compile time.
      - name: Build frontend
        run: npm run build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: tsc
        run: npx tsc --noEmit

      - name: vitest
        run: npx vitest run

  release:
    name: Release (${{ matrix.name }})
    needs: lint-test
    runs-on: ${{ matrix.os }}
    # The updater signing key lives in this environment, which only runs for v* tags. Creating
    # those tags is limited to the maintainers by the "Release tags" ruleset.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          # macos-13 was retired by GitHub; macos-15-intel is the x86_64 runner.
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches app versions
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          pkg=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          echo "tag=$tag tauri.conf.json=$conf Cargo.toml=$cargo package.json=$pkg"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$cargo" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app versions"
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libxtst-dev libxi-dev cmake clang

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Signing is optional. Variables are exported only when the secret exists, so an
      # unconfigured repository produces unsigned builds instead of failing on empty values.
      - name: Enable code signing when secrets are configured
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -n "${!v}" ]; then
              echo "$v<<__EOF__" >> "$GITHUB_ENV"
              echo "${!v}" >> "$GITHUB_ENV"
              echo "__EOF__" >> "$GITHUB_ENV"
              echo "$v is set"
            fi
          done

      - name: Build and publish draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: uttr ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          # In-app updates: sign the update bundles (.app.tar.gz, -setup.exe, .AppImage) and upload a
          # merged latest.json. Installed apps read it from the latest *published* release, so they
          # only see a version after the draft is published. Enabled here, not in tauri.conf.json, so
          # local and CI builds work without the signing key.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Fail if update bundles were not signed
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set: installed apps could not update to this release"
            exit 1
          fi
          n=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name '*.sig' | wc -l)
          echo "signatures: $n"
          [ "$n" -gt 0 ] || { echo "::error::No updater signatures were produced"; exit 1; }
