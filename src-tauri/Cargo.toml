[package]
name = "uttr"
version = "0.2.1"
description = "Local, private push-to-talk dictation powered by sherpa-onnx speech models"
authors = ["Lets Decode AI contributors"]
license = "MIT"
repository = "https://github.com/Lets-Decode-AI/uttr"
homepage = "https://github.com/Lets-Decode-AI/uttr"
readme = "../README.md"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "uttr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2.7.0"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
rubato = "5.0.1"
rdev = "0.5.3"
enigo = "0.6.1"
sha2 = "0.11.1"
hex = "0.4.3"
keyring = "4.2.0"
sysinfo = "0.39.6"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
arboard = { version = "3.7.0", features = ["image-data"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
tokio-util = "0.7.20"
fs4 = "1.1.0"
futures-util = "0.3.34"
sys-locale = "0.3.2"
tauri-plugin-single-instance = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# STT worker panic recovery (catch_unwind + reload) depends on unwinding.
panic = "unwind"
strip = true

# sherpa-onnx is linked statically everywhere. macOS and Windows use the
# prebuilt static archives; the Linux static release archive ships no
# libraries, so on Linux sherpa-onnx is built from source with CMake.
[target.'cfg(not(target_os = "linux"))'.dependencies]
sherpa-rs = { version = "0.6", default-features = false, features = ["download-binaries", "static"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "NSWindow", "NSResponder"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVMediaFormat", "AVCaptureDevice", "block2"] }
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
sherpa-rs = { version = "0.6", default-features = false, features = ["static"] }
x11 = { version = "2.21", features = ["xlib"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
hound = "3.5.1"
tempfile = "3.27.0"
wiremock = "0.6.5"
