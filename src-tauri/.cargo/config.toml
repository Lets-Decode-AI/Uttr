# sherpa-rs links sherpa-onnx statically. On Linux its build script requires
# this relocation model when static linking is enabled.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "relocation-model=dynamic-no-pic"]

# The prebuilt sherpa-onnx static libraries for Windows use the static C
# runtime (/MT), and their onnxruntime and espeak-ng code call the event
# tracing and registry APIs in advapi32. Match the runtime and pass advapi32
# to every link step (sherpa-rs is also linked as its own dll).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=advapi32.lib"]

# llama.cpp (on-device AI) is built by llama-cpp-sys-2 with CMake, which forwards CMAKE_*
# variables. On Windows it must use the same static C runtime (/MT) as everything else;
# CMake applies the runtime through CMAKE_MSVC_RUNTIME_LIBRARY, not compiler flags. Both
# settings only affect MSVC builds. llama.cpp uses std::filesystem, which needs macOS 10.15.
[env]
LLAMA_STATIC_CRT = "1"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
MACOSX_DEPLOYMENT_TARGET = "10.15"
